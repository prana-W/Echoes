version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
    container_name: server
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      MONGODB_URI: mongodb://mongo:27017/echoes-docker-v1
      ACCESS_TOKEN_SECRET: d88415d313890ae41186041393a154c8462bea6e
      ACCESS_TOKEN_EXPIRY: 10d
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:5175
      TEST: env_variables_injected_successfully
      EMAIL_USER: pranaw.kr.dev@gmail.com
      APP_NAME: ojviufulqibxxjou
      EMAIL_PASS: app_password_1234
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      VITE_SERVER_URL: http://localhost:8002/api/v1
      VITE_BASE_SERVER_URL: http://localhost:8002
    depends_on:
      - server

volumes:
  mongo_data:
